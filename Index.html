<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d12">

    <meta name="description"
        content="COMMAND CORE — Advanced Technology, Intelligence and Operations Platform.">

    <title>COMMAND CORE | Global Technology Systems</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: #080d12;
            color: #e8f0f4;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        #app {
            min-height: 100vh;
        }

        .boot-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            text-align: center;
            background:
                radial-gradient(ellipse at center,
                #172a27 0%,
                #0b1117 45%,
                #05080c 100%);
        }

        .emblem {
            width: 95px;
            height: 95px;
            border: 2px solid #39e69a;
            display: grid;
            place-items: center;
            transform: rotate(45deg);
            box-shadow: 0 0 35px #39e69a30;
            margin-bottom: 38px;
        }

        .emblem span {
            transform: rotate(-45deg);
            font-size: 43px;
            font-weight: 900;
            color: #39e69a;
        }

        .brand {
            font-size: clamp(27px, 7vw, 46px);
            font-weight: 900;
            letter-spacing: 5px;
            margin: 0;
        }

        .description {
            color: #39e69a;
            font-size: 10px;
            letter-spacing: 4px;
            margin-top: 15px;
        }

        .status {
            margin-top: 45px;
            color: #9aa9b4;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .progress {
            width: 220px;
            height: 3px;
            background: #1d292d;
            margin-top: 18px;
            overflow: hidden;
        }

        .progress span {
            display: block;
            height: 100%;
            width: 40%;
            background: #39e69a;
            animation: scan 1.5s infinite ease-in-out;
        }

        .footer {
            position: absolute;
            bottom: 25px;
            color: #64716e;
            font-size: 9px;
            letter-spacing: 2px;
        }

        @keyframes scan {
            from { transform: translateX(-110%); }
            to { transform: translateX(270%); }
        }

        @media(max-width: 480px) {
            .brand {
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

    <div id="app">
        <main class="boot-screen">

            <div class="emblem">
                <span>C</span>
            </div>

            <h1 class="brand">COMMAND CORE</h1>

            <div class="description">
                GLOBAL TECHNOLOGY SYSTEMS
            </div>

            <div class="status">
                INITIALIZING COMMAND ENVIRONMENT
            </div>

            <div class="progress">
                <span></span>
            </div>

            <div class="footer">
                COMMAND CORE SYSTEMS · 2026
            </div>

        </main>
    </div>

    <script type="module" src="./src/main.js"></script>

</body>
    </html>
